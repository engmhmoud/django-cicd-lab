# Commit stage: fast feedback on every PR and on every push to main (owned by Lab 2; later labs add their own files).
# Required checks (ruleset on main): `lint` and `test`. Do not rename those jobs (the ruleset matches names).
name: ci

on:
  pull_request:               # no paths/paths-ignore here: a skipped WORKFLOW leaves required checks "Expected" forever
  push:
    branches: [main]
  merge_group:              # a merge queue (org-owned repos / Enterprise Cloud) tests PRs in merge order

permissions:
  contents: read            # least privilege for GITHUB_TOKEN; jobs ask for more only if they need it

concurrency:
  # PRs: one group per branch, a new push cancels the old run. Pushes to main and merge-queue runs: one group PER COMMIT.
  # (A shared group on main would keep only ONE pending run: a third quick merge cancels the second commit's run,
  # even with cancel-in-progress: false. `queue: max` is the other fix, but it can't be combined with
  # cancel-in-progress: true in the same block.)
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:                  # decides inside the workflow; a job skipped by `if:` reports "Success" to required checks
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 between Oct 19 and Nov 19, 2026
    timeout-minutes: 2
    permissions:
      pull-requests: read   # to list the PR's files
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:                # pass context through env, never ${{ }} inside the script (injection-safe)
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "LAB DEMO: simulate a broken changes job"; exit 1
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # fail closed, step level: if the file list can't be read, run everything. The JOB level is covered by the
          # `if:` on lint/test/compat: they are skipped ONLY when `changes` succeeded AND said code=false. A failed or
          # timed-out `changes` job (whatever its output) makes them run; `!cancelled()` stops `needs` from skipping them.
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename') || { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -qvE '\.md$'; then code=true; else code=false; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: requirements-dev.lock   # the key changes when ANY pin changes (runtime or dev)
      - run: pip install --require-hashes -r requirements-dev.lock   # the same runtime pins the image installs
      - name: Dev lock uses the image's runtime pins
        run: |
          # requirements-dev.lock is compiled with `-c requirements.lock`; fail if someone edited one without the other
          grep -oE '^[a-z0-9._-]+==[^ ;]+' requirements.lock | while read -r pin; do
            grep -qE "^${pin} " requirements-dev.lock || { echo "drift: $pin not in requirements-dev.lock"; exit 1; }
          done
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: requirements-dev.lock   # the key changes when ANY pin changes (runtime or dev)
      - run: pip install --require-hashes -r requirements-dev.lock   # the same runtime pins the image installs
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: |
          mkdir -p reports
          python manage.py test --parallel auto --shuffle --durations 5 2>&1 | tee reports/test-output.txt
          exit "${PIPESTATUS[0]}"
      - name: Keep the test report
        if: ${{ !cancelled() }}         # upload on success and on failure, not when the run was cancelled
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: reports/
          retention-days: 7

  compat:                    # NOT a required check. Matrix check names look like "compat (3.14.8, 17.11)".
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false       # show every failing combination, not just the first
      matrix:
        python: ["3.14.8"]   # 3.13 removed: the models use uuid.uuid7 (Python 3.14+); found by this matrix
        postgres: ["16.15", "17.11", "18.6"]   # Django 6.1 supports PostgreSQL 15+
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock   # the key changes when ANY pin changes (runtime or dev)
      - run: pip install --require-hashes -r requirements-dev.lock   # the same runtime pins the image installs
      - run: python manage.py test --parallel auto
