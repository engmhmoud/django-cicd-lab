# Lab 8 (learning/013 ch05): continuous deployment with gates and an automatic rollback.
# BUILD ONCE: this workflow builds nothing. lab04-supply-chain.yml builds, scans, signs and attests the
# release image on every push to main, then calls this workflow with that digest. Each environment
# verifies the signature (cosign, exact workflow identity) BEFORE deploying, then deploys the SAME digest:
# staging (deploy, smoke test) → production (wait timer, branch policy, smoke test).
# Each environment is rebuilt inside this ephemeral runner from its last-known-good digest
# (registry tag cd-<env>) and then upgraded: see deploy/deploy.sh.
name: lab08-cd

on:
  workflow_call:
    inputs:
      digest:
        description: "sha256:... of the signed release image (from lab04-supply-chain)"
        type: string
        required: true
      expected_sha:
        description: "git sha the image must report on /version"
        type: string
        required: true
      break_production_smoke:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      digest:
        description: "sha256:... to deploy (must carry a valid Lab 4 signature, or the deploy is refused)"
        type: string
        required: true
      expected_sha:
        description: "git sha the image must report on /version"
        type: string
        required: true
      break_production_smoke:
        description: "Lab only: make the production smoke test expect a wrong SHA, to exercise the rollback"
        type: boolean
        default: false

permissions:
  contents: read            # jobs raise only what they need

env:
  IMAGE: ghcr.io/engmhmoud/django-cicd-lab
  COSIGN_VERSION: v3.1.3
  # Only signatures made by the Lab 4 release workflow on main are accepted.
  SIGNER: https://github.com/engmhmoud/django-cicd-lab/.github/workflows/lab04-supply-chain.yml@refs/heads/main
  ISSUER: https://token.actions.githubusercontent.com

jobs:
  staging:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 between Oct 19 and Nov 19, 2026
    timeout-minutes: 15
    concurrency:
      group: lab08-staging  # one deployment per environment; a running deploy is never cancelled
      cancel-in-progress: false
    environment:
      name: staging
    permissions:
      contents: read
      packages: write       # pull the image and move the cd-staging pointer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Verify the signature before deploying (refuse anything Lab 4 didn't sign)
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "$SIGNER" --certificate-oidc-issuer "$ISSUER" \
            | jq -r '.[] | "verified: \(.critical.image["docker-manifest-digest"])"'
      - name: Deploy, smoke test, roll back on failure
        env:
          NEW_REF: ${{ env.IMAGE }}@${{ inputs.digest }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: sh deploy/deploy.sh staging "$NEW_REF" "$EXPECTED_SHA"

  production:
    needs: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: lab08-production
      cancel-in-progress: false
    environment:
      name: production      # protected: wait timer + main-only deployment branch policy (set via the API)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Verify the signature again (each environment checks what it runs)
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "$SIGNER" --certificate-oidc-issuer "$ISSUER" \
            | jq -r '.[] | "verified: \(.critical.image["docker-manifest-digest"])"'
      - name: Deploy the same digest, smoke test, roll back on failure
        env:
          NEW_REF: ${{ env.IMAGE }}@${{ inputs.digest }}
          EXPECTED_SHA: ${{ inputs.break_production_smoke && 'deliberately-wrong-sha' || inputs.expected_sha }}
        run: sh deploy/deploy.sh production "$NEW_REF" "$EXPECTED_SHA"
