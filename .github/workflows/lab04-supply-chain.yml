# Lab 4 (learning/013 ch04): build once, scan, push, sign, attest, SBOM, verify; plus a workflow audit.
# PRs: build locally + scan (no registry writes). main: build + push to GHCR, scan the pushed digest,
# then sign and attest it only if the scan passed, verify, and hand the SAME digest to the Lab 8 deploy
# (lab08-cd.yml, a reusable workflow that runs cosign verify again before each environment).
name: lab04-supply-chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read            # jobs raise only what they need

concurrency:
  group: lab04-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/engmhmoud/django-cicd-lab
  TRIVY_VERSION: v0.76.0
  COSIGN_VERSION: v3.1.3

jobs:
  workflow-audit:
    name: workflow-audit
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 between Oct 19 and Nov 19, 2026
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (syntax, expressions, shellcheck)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: zizmor (security audit, offline)
        if: ${{ !cancelled() }}   # run even when actionlint failed: show every finding at once
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/zizmorcore/zizmor@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 --offline --min-severity low /repo/.github/workflows

  pr-image-scan:
    name: pr-image-scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (load into the runner's Docker, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: lab04:pr
          build-args: |
            APP_VERSION=pr
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Scan (gate on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: lab04:pr
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  release-image:
    name: release-image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # OIDC token for keyless cosign and attestations
      attestations: write   # store the provenance attestation
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
      - name: Build and push (SBOM + max provenance as BuildKit attestations)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
            GIT_SHA=${{ github.sha }}
          sbom: true
          provenance: mode=max
          # no cache on the release build: a release must not restore state another job wrote (zizmor cache-poisoning)
      - name: Scan the pushed digest (gate before signing)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          cache: "false"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign the digest (keyless, GitHub OIDC → Fulcio cert → Rekor)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Provenance attestation (GitHub artifact attestation, SLSA provenance v1)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM file (Syft, SPDX JSON) as a build artifact
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ github.sha }}.spdx.json
          upload-release-assets: false

  verify:
    name: verify
    needs: release-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read        # pull the image and its signature from GHCR
      attestations: read    # read the provenance attestation
    env:
      DIGEST: ${{ needs.release-image.outputs.digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: cosign verify (right identity → must pass)
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/engmhmoud/django-cicd-lab/.github/workflows/lab04-supply-chain.yml@refs/heads/main" \
            | jq -r '.[] | "verified: \(.critical.type)  \(.critical.image["docker-manifest-digest"])"'
      - name: cosign verify (wrong identity → must fail)
        run: |
          if cosign verify "${IMAGE}@${DIGEST}" \
               --certificate-oidc-issuer https://token.actions.githubusercontent.com \
               --certificate-identity "https://github.com/engmhmoud/django-cicd-lab/.github/workflows/ci.yml@refs/heads/main" \
               >/dev/null 2>err.txt; then
            echo "UNEXPECTED: a signature from another workflow was accepted"; exit 1
          fi
          echo "rejected as expected:"; tail -n 2 err.txt
      - name: gh attestation verify (provenance from this repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo engmhmoud/django-cicd-lab --format json | jq -r '.[0].verificationResult.statement.predicateType'

  deploy:
    name: deploy
    needs: [release-image, verify]
    permissions:
      contents: read
      packages: write       # the called workflow pulls the image and moves the cd-<env> pointers
    # A local call runs this same commit's lab08-cd.yml. zizmor prefers GitHub's newer `$/` syntax (Jul 2026),
    # but the pinned actionlint can't parse it yet, so the classic form stays (suppressed on purpose).
    uses: ./.github/workflows/lab08-cd.yml # zizmor: ignore[self-repository]
    with:
      digest: ${{ needs.release-image.outputs.digest }}
      expected_sha: ${{ github.sha }}
