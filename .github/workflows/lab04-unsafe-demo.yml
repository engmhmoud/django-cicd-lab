# Lab 4 demo, fixed: the action is pinned by SHA and the untrusted value reaches the shell as data. Never merged.
name: lab04-unsafe-demo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  greet:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Echo the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}   # expanded into an env var, not into the script
        run: |
          echo "PR title is ${PR_TITLE}"
