# Lab 3 (013 ch03): test-quality gates and experiments.
# The gates (coverage, shuffle-hunt, migrations) run only on PRs from lab03/* branches, so the other labs' PRs in this
# shared repo aren't affected. In a real service they belong in ci.yml as required checks (see ch03 §8).
name: lab03-tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      experiment:
        description: "timing = serial vs parallel on a DB-heavy suite; cache = dependency install with and without caches"
        type: choice
        options: [timing, cache]
        default: timing

permissions:
  contents: read

concurrency:
  group: lab03-${{ github.ref }}-${{ inputs.experiment }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  POSTGRES_HOST: localhost

jobs:
  coverage:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'lab03/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services: &pg
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests under coverage (parallel workers measured too, see .coveragerc)
        run: coverage run manage.py test --parallel auto --shuffle
      - name: Coverage gate
        run: |
          coverage combine -q
          coverage xml -q -o reports/coverage.xml
          coverage report --fail-under=90
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: reports/
          retention-days: 7

  shuffle-hunt:              # order-dependent tests: run the suite in several random orders, report failing seeds
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'lab03/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services: *pg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Default order, reversed order, 8 random orders
        run: |
          failed=0
          run() {  # $1 = label, rest = extra args
            label=$1; shift
            if python manage.py test --parallel auto "$@" > out.txt 2>&1; then r=ok; else r=FAILED; failed=1; fi
            seed=$(grep -oE 'Used shuffle seed: [0-9]+' out.txt | grep -oE '[0-9]+' || true)
            printf '%-10s %-7s %s\n' "$label" "$r" "${seed:+seed=$seed}"
          }
          run default
          run reverse --reverse
          for i in 1 2 3 4 5 6 7 8; do run "shuffle-$i" --shuffle; done
          exit $failed

  migrations:                # migrations that break the PREVIOUS app version (rename, drop, NOT NULL) fail here
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'lab03/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services: *pg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0       # the linter diffs against the PR's base commit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: What would migrate run?
        run: python manage.py migrate --plan
      - name: Lint the migrations this PR adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DJANGO_SETTINGS_MODULE: config.settings_lint
        # --project-root-path is required: by default the linter runs `git diff --relative` inside the SETTINGS folder
        # (config/), finds 0 migrations and passes ("Valid migrations: 0/0") -- a green gate that checked nothing.
        run: python manage.py lintmigrations --git-commit-id "$BASE_SHA" --project-root-path .

  timing:                    # manual: serial vs parallel, with and without a durable test database
    if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'timing'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        parallel: ["1", "auto"]
        durability: ["default", "off"]
    services: *pg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Test database without durability (fsync etc. off; never do this outside tests)
        if: matrix.durability == 'off'
        env:
          PGPASSWORD: app
        run: |
          psql -h localhost -U app -d app -qc "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - name: Heavy suite (120 DB-bound tests)
        env:
          PARALLEL: ${{ matrix.parallel }}
          DURABILITY: ${{ matrix.durability }}
        run: |
          echo "cpus=$(nproc)"
          start=$(date +%s%N)
          python manage.py test orders.heavy_checks --parallel "$PARALLEL" 2>&1 | grep -E '^(Ran|OK|FAILED)'
          end=$(date +%s%N)
          echo "RESULT parallel=$PARALLEL durability=$DURABILITY wall=$(( (end - start) / 1000000 )) ms"

  cache:                     # manual: what does each cache actually save on this project?
    if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'cache'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: ["pip-no-cache", "pip-cache", "uv-cache"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: ${{ matrix.mode == 'pip-cache' && 'pip' || '' }}
          cache-dependency-path: requirements-dev.txt
      - if: matrix.mode == 'uv-cache'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt
      - name: Install the dev requirements (timed)
        env:
          MODE: ${{ matrix.mode }}
        run: |
          start=$(date +%s%N)
          if [ "$MODE" = "uv-cache" ]; then uv pip install --system -q -r requirements-dev.txt
          else pip install -q -r requirements-dev.txt; fi
          end=$(date +%s%N)
          echo "RESULT mode=$MODE install=$(( (end - start) / 1000000 )) ms"
