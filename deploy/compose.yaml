# One environment of the orders service (Lab 8). The CD workflow runs it inside the GitHub runner:
#   IMAGE_REF=ghcr.io/<owner>/<repo>@sha256:... docker compose -p staging -f deploy/compose.yaml up -d --wait
# The image is always referenced by DIGEST: the signed bytes Lab 4 released, verified before deploy (ch04/ch05).

services:
  db:
    image: postgres:18.6
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:                     # pre-deploy job: runs once per deploy, before the new app starts
    image: ${IMAGE_REF:?set IMAGE_REF to image@digest}
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: &env
      POSTGRES_HOST: db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on:
      db: {condition: service_healthy}

  app:
    image: ${IMAGE_REF:?set IMAGE_REF to image@digest}
    environment: *env
    stop_grace_period: 25s     # > gunicorn --graceful-timeout 20 (Dockerfile); Docker's default 10 s would SIGKILL first (005 ch04)
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
